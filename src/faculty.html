<body data-page="faculty">
{{header}}
<main id="main">
  <section class="page-head layer" data-layer="deep" data-depth="1600" data-depth-name="reticular" style="padding-bottom:0">
    <div class="wrap">
      <h1 data-i18n="faculty.page.title">The faculty</h1>
      <p data-i18n="faculty.page.lede">Lecturers and staff of the Dermatology program, with their training, expertise and recent papers.</p>
    </div>
  </section>
  <section class="layer" data-layer="deep" data-depth="1600" data-depth-name="reticular" style="padding-top:clamp(40px,6vw,72px)">
    <div class="wrap">
      <div class="profiles" id="profiles"></div>
      <div class="block">
        <h2 data-i18n="staff.title">Academic officers</h2>
        <p class="muted-note" data-i18n="staff.body">Thanks to the academic officers who support the program and its students.</p>
        <div class="staff" id="staffList" style="margin-top:20px;border-top:0;padding-top:0"></div>
      </div>
    </div>
  </section>
</main>
{{footer}}
<script src="js/pages.js" defer></script>
</body>
</html>
