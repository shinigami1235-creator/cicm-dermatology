# CICM Dermatology at https://cicm.tu.ac.th/dermatology/
# Paste these two blocks inside the server { } block for cicm.tu.ac.th.
# Change /var/www/html to the folder that holds the dermatology folder
# (on Windows, for example C:/nginx/html), then run: nginx -t && nginx -s reload

location = /dermatology {
    return 301 /dermatology/;
}

location ^~ /dermatology/ {
    root /var/www/html;
    index index.html;
    try_files $uri $uri/ =404;

    # Security headers. They sit here only: an add_header inside the blocks below would drop them,
    # so those blocks use "expires" for caching.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://connect.facebook.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self'; font-src 'self'; connect-src 'self' https://docs.google.com https://*.googleusercontent.com https://*.facebook.com; frame-src https://*.facebook.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Text files are sent compressed
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hidden files such as .git or .env are never served
    location ~ /\. {
        deny all;
    }

    # Pages and data/*.json are checked on every visit since staff edits land in them
    location ~* \.(html|json)$ {
        expires -1;
    }

    # Scripts and styles
    location ~* \.(css|js)$ {
        expires 1h;
    }

    # Photos, fonts, films and the 3D emblem
    location ~* \.(webp|jpg|jpeg|png|svg|woff2|mp4|webm|glb)$ {
        expires 7d;
    }
}
